[project]
name = "studyai"
version = "0.0.0"
description = "Local-first AWS Certified Generative AI Developer (AIP-C01) study platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pydantic v2 validates every artifact/request that crosses a boundary.
    # The narrow local stdio MCP server is implemented over the standard
    # library (JSON-RPC over stdio) to keep the local-first footprint minimal
    # and avoid a native cryptography toolchain the environment cannot build.
    "pydantic>=2.9,<3.0",
    # Streamlit renders the local learning workspace (Phase 2).
    "streamlit>=1.40,<2.0",
    # boto3 backs the read-only AWS lab validators (Phase 2, Slice B).
    "boto3>=1.35,<2.0",
]

[dependency-groups]
# Development-only tooling. Pinned to exact versions for reproducibility.
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[tool.uv]
# Keep resolution reproducible; the committed uv.lock is authoritative.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["study_core", "study_mcp", "study_aws", "app", "content", "scripts", "tests"]

[tool.ruff.lint]
# TC/TCH (type-checking-block) rules are omitted: Pydantic models need their
# field types importable at runtime, so moving them into TYPE_CHECKING blocks
# would break validation.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Authored question/answer prose: long option and rationale strings are allowed.
"content/domain1_questions.py" = ["E501"]
"content/domain2_questions.py" = ["E501"]
"content/domain3_questions.py" = ["E501"]
"content/domain4_questions.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# Phase 0-2 ship study_core, study_mcp, study_aws, app, content, scripts,
# and tests.
files = ["study_core", "study_mcp", "study_aws", "app", "content", "scripts", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true



[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
